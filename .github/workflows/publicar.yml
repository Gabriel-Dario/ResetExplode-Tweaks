name: Publicar

# Publicação explícita pelo mantenedor; push comum somente verifica o código.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verificar recuperação
        run: dotnet run --project tests/ResetExplode.Advisor.Tests.csproj -c Release

      - name: Verificar interface
        run: dotnet run --project tests/UiSmoke/ResetExplode.UiSmoke.csproj -c Release

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Copy-Item LICENSE dist/LICENSE
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/ResetExplode.exe, dist/LEIA-ME.txt, dist/LICENSE, dist/README.md -DestinationPath ResetExplode.zip

      - name: Criar release versionada
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ([xml](Get-Content ResetExplode.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          gh release create "v$version" ResetExplode.zip dist/ResetExplode.exe --target $env:GITHUB_SHA --title "ResetExplode Tweaks v$version" --notes-file README.md
